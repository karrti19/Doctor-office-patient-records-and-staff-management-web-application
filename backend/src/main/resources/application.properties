spring.application.name=carepoint
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carepoint?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:carepoint}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=20m
management.endpoints.web.exposure.include=health
